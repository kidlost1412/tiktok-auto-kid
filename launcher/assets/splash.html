<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Auto Kid</title>
<style>
:root{--bg:#f7f6f9;--card:#fff;--line:#e5e2ea;--accent:#7c3aed;--accent-hover:#6d28d9;--bad:#dc2626;--bad-bg:#fef2f2;--ink:#1f1b2a;--muted:#6b6678;--soft:#efedf3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);cursor:default;
  font-family:Inter,Nunito,"Segoe UI Variable Display","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none}
body{position:relative;opacity:0;transition:opacity .4s ease}
body.go{opacity:1}
body.out{opacity:0;transform:scale(.985);transition:opacity .34s ease-in,transform .34s ease-in}

.card{position:absolute;inset:12px 16px 16px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 1px 3px rgba(31,27,42,.12);overflow:hidden}

.stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:4px;transition:opacity .2s}
.logo{position:relative;width:104px;height:104px;margin-bottom:20px}
.logo svg{width:100%;height:100%;display:block}
.logo.pop{animation:pop .2s ease-out 1}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

h1{font-size:32px;font-weight:600;line-height:1.1;color:var(--ink)}
.sub{margin-top:8px;font-size:14px;font-weight:500;color:var(--muted)}

.load{margin-top:32px;display:flex;flex-direction:column;align-items:center;width:100%;transition:opacity .2s}
.bar{position:relative;width:340px;height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:99px}
.fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.2) 0 8px,transparent 8px 16px);
  background-size:22.6px 100%;animation:stripe 1s linear infinite}
@keyframes stripe{to{background-position:22.6px 0}}
.status{position:relative;height:24px;width:100%;margin-top:16px;font-size:16px;font-weight:500;color:var(--ink);text-align:center}
.status span{position:absolute;left:0;right:0;top:0;opacity:0;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease}
.status span.on{opacity:1;transform:none}
.status span.off{opacity:0;transform:translateY(-8px)}
.pct{margin-top:4px;font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}

.ver{position:absolute;left:32px;bottom:24px;font-size:12px;font-weight:500;color:var(--muted)}
.brand{position:absolute;right:32px;bottom:24px;font-size:12px;font-weight:500;color:var(--muted)}

/* thẻ lỗi */
.err{position:absolute;left:50%;top:50%;width:500px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;
  padding:24px 28px;border-radius:12px;text-align:center;background:var(--bad-bg);border:1px solid var(--bad);
  transition:opacity .2s ease,transform .2s ease}
.errmode .err{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.errmode .stage{opacity:.18}
.ico{width:48px;height:48px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--bad);color:var(--bad)}
.ico svg{width:24px;height:24px}
.err h2{font-size:20px;font-weight:600;color:var(--ink)}
.err p{margin-top:8px;font-size:14px;font-weight:400;line-height:1.5;color:var(--ink);max-height:88px;overflow:auto;word-break:break-word}
.btns{margin-top:20px;display:flex;gap:8px;justify-content:center}
button{font:inherit;font-size:14px;font-weight:500;cursor:pointer;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:8px 20px;min-height:40px;transition:background .15s}
button:hover{background:var(--soft)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{background:var(--accent-hover)}
.errmode .load{opacity:0}
</style>
</head>
<body>
<div class="card">
  <div class="stage">
    <div class="logo" id="logo">
      <svg viewBox="0 0 104 104" xmlns="http://www.w3.org/2000/svg">
        <rect x="3" y="3" width="98" height="98" rx="27" fill="#2a2230" stroke="#4A3428" stroke-width="4"/>
        <rect x="9" y="9" width="86" height="86" rx="22" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="2"/>
        <g transform="translate(0,2)">
          <path d="M27 29h50v15H59.5v33h-15V44H27z" transform="translate(5,-4)" fill="#fe2c55"/>
          <path d="M27 29h50v15H59.5v33h-15V44H27z" transform="translate(-5,4)" fill="#25f4ee"/>
          <path d="M27 29h50v15H59.5v33h-15V44H27z" fill="#fff"/>
        </g>
      </svg>
    </div>
    <h1>TikTok Auto Kid</h1>
    <div class="sub">Tự động hoá kênh TikTok của bạn</div>
    <div class="load">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="status" id="status"><span class="on" id="s0">Đang khởi động…</span><span id="s1"></span></div>
      <div class="pct" id="pct">0%</div>
    </div>
  </div>
  <div class="err" id="err">
    <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 8v5m0 3.5v.01M10.3 4.6L3.2 17a2 2 0 001.7 3h14.2a2 2 0 001.7-3L13.7 4.6a2 2 0 00-3.4 0z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <h2>Chưa mở được TikTok Auto Kid</h2>
    <p id="errmsg"></p>
    <div class="btns">
      <button class="pri" id="bRetry">Thử lại</button>
      <button id="bDetail">Xem chi tiết</button>
      <button class="ghost" id="bClose">Đóng</button>
    </div>
  </div>
  <div class="ver">v{{VERSION}}</div>
  <div class="brand">TikTok Auto Kid</div>
</div>

<script>
(function(){
  var fill=document.getElementById('fill'),pctEl=document.getElementById('pct'),logo=document.getElementById('logo');
  var spans=[document.getElementById('s0'),document.getElementById('s1')],cur=0,curText='Đang khởi động…';
  var shown=0,target=0,mode='load',fast=false,doneAt=0,last=0,finished=false;
  function call(n){try{if(window[n])return window[n].apply(null,[].slice.call(arguments,1))}catch(e){}}

  function emo(t){return t==='Sẵn sàng!'?'':''}
  function setText(t){
    if(!t)return; t=emo(t)+t; if(t===curText)return; curText=t;
    var a=spans[cur],b=spans[1-cur];
    b.textContent=t; b.className='on'; a.className='off'; cur=1-cur;
    setTimeout(function(){ if(spans[1-cur]) spans[1-cur].className=''; },420);
  }
  function frame(ts){
    var dt=Math.min(.1,(ts-(last||ts))/1000); last=ts;
    if(mode==='load'||mode==='ready'){
      var rate=mode==='ready'?(fast?9:4.5):2.6;
      if(shown<target){
        var step=(target-shown)*(1-Math.exp(-dt*rate))+dt*(mode==='ready'?(fast?55:30):1.2);
        shown=Math.min(target,shown+step);
      }else if(mode==='load'){
        // nhích nhẹ để không bao giờ trông như đứng yên
        var cap=Math.min(target+6,96);
        if(shown<cap) shown+=dt*Math.max(.25,(cap-shown)*.12);
      }
      fill.style.width=shown.toFixed(2)+'%';
      pctEl.textContent=Math.floor(shown)+'%';
      if(mode==='ready'&&shown>=99.9&&!doneAt){
        doneAt=ts; logo.classList.add('pop');
        setTimeout(function(){document.body.classList.add('out')},fast?160:520);
        setTimeout(function(){finished=true;call('ttaDone')},fast?160+300:520+380);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.splash={
    start:function(){document.body.classList.add('go')},
    set:function(p,t){
      if(mode!=='load')return;
      if(p>target)target=Math.min(p,99);
      setText(t);
    },
    ready:function(f){
      if(mode==='ready')return;
      fast=!!f; mode='ready'; target=100; document.body.classList.remove('errmode');
      setText('Sẵn sàng');
    },
    fail:function(msg){
      mode='error';
      document.getElementById('errmsg').textContent=msg||'Đã có lỗi khi khởi động';
      document.body.classList.add('errmode');
    },
    reset:function(){
      mode='load';shown=0;target=0;doneAt=0;
      document.body.classList.remove('errmode','out');
      document.body.classList.add('go');
      fill.style.width='0%';pctEl.textContent='0%';
      setText('Đang khởi động…');
    }
  };
  document.getElementById('bRetry').onclick=function(){call('ttaRetry')};
  document.getElementById('bDetail').onclick=function(){call('ttaDetails')};
  document.getElementById('bClose').onclick=function(){call('ttaClose')};
  document.addEventListener('mousedown',function(e){
    if(e.button===0&&!(e.target.closest&&e.target.closest('button')))call('ttaDrag');
  });
  document.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
</script>
</body>
</html>
