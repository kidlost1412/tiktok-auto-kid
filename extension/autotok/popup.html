<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>TikTok Auto Kid – tiện ích</title>
<style>
:root{--bg:#f7f6f9;--card:#fff;--line:#e5e2ea;--accent:#7c3aed;--accent-hover:#6d28d9;--ok:#16a34a;--bad:#dc2626;--warn-bg:#fef2f2;--ink:#1f1b2a;--muted:#6b6678;--soft:#efedf3}
*{box-sizing:border-box}
body{margin:0;width:340px;background:var(--bg);color:var(--ink);font:13px/1.4 Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
.wrap{padding:12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.title{font-weight:600;font-size:16px}
.big{font-weight:600;font-size:16px}
.sub{color:var(--muted);font-size:12px;margin-top:4px;word-break:break-word}
.bar{height:8px;border-radius:99px;background:var(--soft);margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.st-idle{background:var(--card)}.st-run{background:var(--soft)}.st-err{background:var(--warn-bg);border-color:var(--bad)}
.row{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:#c4c0cc;flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
button{font:inherit;font-weight:500;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:36px;flex:1}
button:hover{background:var(--soft)}
#pairBtn,#save{background:var(--accent);border-color:var(--accent);color:#fff}
#pairBtn:hover,#save:hover{background:var(--accent-hover)}
button.small{flex:none;padding:4px 12px;min-height:28px;font-size:12px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
summary{font-weight:600;cursor:pointer}
label{display:block;margin-top:8px;font-size:12px;color:var(--muted)}
input[type=text],input[type=password],select{width:100%;font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;color:var(--ink)}
pre{margin:8px 0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:160px;overflow:auto;white-space:pre-wrap;font:11px/1.4 Consolas,monospace}
</style></head><body><div class="wrap">
<div class="card st-idle" id="status"><div class="big" id="sTitle">Đang rảnh</div><div class="sub" id="sSub"></div><div class="bar" id="bar" hidden><i id="barFill"></i></div></div>
<div class="card"><div class="row"><span class="dot" id="srvDot"></span><div><div class="big" id="srvText">Máy chủ: chưa rõ</div><div class="sub" id="srvSub"></div></div></div>
<div class="sub" id="acct" style="margin-top:8px">Tài khoản TikTok: chưa biết</div><div class="sub" id="collect"></div></div>
<div class="card" id="pairBox" hidden><div class="big">Ghép nối với ứng dụng</div><div class="sub">Mã 6 số hiện ở TikTok Auto Kid (Cài đặt → Kết nối Chrome)</div>
<div class="row" style="margin-top:8px"><input type="text" id="code" inputmode="numeric" maxlength="6" placeholder="123456"><button id="pairBtn" class="small">Ghép nối</button></div><div class="sub" id="pairErr" style="color:var(--bad)"></div></div>
<div class="row"><button id="selfcheck">Tự kiểm</button><button id="pollnow">Hỏi việc ngay</button></div>
<details id="dSet"><summary>Cài đặt</summary>
<label>Địa chỉ máy chủ</label><input type="text" id="server">
<label>Kiểu cửa sổ</label><select id="strategy"><option value="minimized">Thu nhỏ</option><option value="unfocused">Cửa sổ thường, không focus</option><option value="tab">Tab nền</option></select>
<label class="chk"><input type="checkbox" id="polling"> Bật nhận việc</label>
<label class="chk"><input type="checkbox" id="keepOpen"> Giữ cửa sổ sau khi xong</label>
<div class="row" style="margin-top:8px"><button id="save" class="small">Lưu</button><button id="unpair" class="small" hidden>Bỏ ghép nối</button><span class="sub" id="saved"></span></div></details>
<details id="dLog"><summary>Nhật ký</summary><pre id="log"></pre><div class="row"><button id="copy" class="small">Chép kết quả</button><button id="clear" class="small">Xoá việc/nhật ký</button></div></details>
</div><script src="popup.js"></script></body></html>
